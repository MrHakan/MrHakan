name: Age of Troll match rotation

# Builds a chain of a few of the 30 pre-rendered bot matches in assets/aot,
# picked at random and played back to back in one looping image (a README
# image cannot run any script, so "when a match ends, the next one starts"
# lives inside the file), and publishes it to the `aot` branch as current.webp
# and current.json, which README.md embeds. None of the matches that are up now
# is picked again, so the new chain never opens with the match that just played.
# The films are joined frame by frame with webpmux (scripts/aot-chain.sh);
# nothing is re-encoded, so it runs in seconds. Uses only the default
# GITHUB_TOKEN.
#
# The matches themselves are made once, locally, by
# scripts/age-of-troll-readme.mjs --count 30.
#
# Not the `output` branch: the snake workflow force-publishes that one and
# would wipe these files.
on:
  schedule:
    - cron: "7,37 * * * *" # every 30 minutes
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aot-rotate
  cancel-in-progress: true

jobs:
  rotate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the matches
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            assets/aot
            scripts/aot-chain.sh
          sparse-checkout-cone-mode: false

      - name: Install webpmux
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq webp
          webpmux -version

      - name: Build the chain
        run: |
          set -euo pipefail
          # what is up now, if the branch exists yet: a chain, or the older
          # single-match file
          current=""
          if git fetch --quiet --depth=1 origin aot 2>/dev/null; then
            current=$(git show FETCH_HEAD:current.json 2>/dev/null \
              | jq -r '[(.chain // [])[].n, (.n // empty)] | map(tostring) | join(" ")' || true)
          fi
          echo "up now: ${current:-nothing}"
          bash scripts/aot-chain.sh --count 3 --max-bytes 4500000 --exclude "$current" --out dist

      - name: Publish to aot branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: aot
          build_dir: dist
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
